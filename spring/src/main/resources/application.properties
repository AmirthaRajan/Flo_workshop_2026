# Values are read from environment variables or from the local .env file
# (same variable names as the Python edition). Copy .env.example to .env.
spring.config.import=optional:file:.env[.properties]
spring.application.name=rag-onboarding-chatbot

# --- Ollama models: auto-configured by langchain4j-ollama-spring-boot4-starter ---
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_LLM_MODEL:}
langchain4j.ollama.chat-model.temperature=0
langchain4j.ollama.chat-model.timeout=5m
langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBEDDING_MODEL:}
langchain4j.ollama.embedding-model.timeout=5m

# --- Workshop settings (WorkshopSettings.java) ---
workshop.model-provider=${MODEL_PROVIDER:ollama}
workshop.embedding-provider=${EMBEDDING_PROVIDER:ollama}
workshop.top-k=${TOP_K:4}
workshop.chunk-size=${CHUNK_SIZE:800}
workshop.chunk-overlap=${CHUNK_OVERLAP:100}
workshop.vector-store-path=${VECTOR_STORE_PATH:data/vector_store}
workshop.documents-path=${DOCUMENTS_PATH:data/documents}
workshop.allow-private-urls=${ALLOW_PRIVATE_URLS:false}

server.port=${SERVER_PORT:8080}
# Match Streamlit's default 200 MB upload limit.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
